# Docker Release Workflow
# Builds and publishes cross-platform Docker images to Docker Hub using ko
# Triggers on release publish or manual dispatch

name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v7

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10

      - name: Login to Registry
        env:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$password" | ko login docker.io -u "$username" --password-stdin

      - name: Build Web
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Build and Push
        env:
          KO_DOCKER_REPO: ${{ vars.DOCKERHUB_REPO }}
          VERSION: ${{ github.ref_name }}
        run: ko build --sbom none --bare --tags latest,${{ github.ref_name }} .

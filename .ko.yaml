# Ko configuration for building container images
# See: https://ko.build/configuration/

defaultBaseImage: gcr.io/distroless/static

# Target platforms for multi-architecture builds
defaultPlatforms:
  - all

builds:
  - id: hey
    main: ./cmd/hey
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -extldflags '-static'
      - -X main.Version={{.Env.VERSION}}
